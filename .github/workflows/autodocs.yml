name: AutoDocs CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --configuration Release --no-restore

      - name: Run tests
        run: dotnet test --configuration Release --no-build

      - name: Restore DemoApi
        run: dotnet restore samples/DemoApi/DemoApi.csproj

      - name: Check API documentation
        run: >
          dotnet run
          --project src/AutoDocs.Cli
          --configuration Release
          --no-build
          --
          check
          --project samples/DemoApi/DemoApi.csproj
          --docs samples/DemoApi/docs/openapi.json
          --no-history

